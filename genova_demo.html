<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genova · Item Setup · Representative prototype</title>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#0f1a2e; --ink2:#34405a; --muted:#56627a; --line:#d5dce7; --line2:#e7ebf2;
  --accent:#1c3d8c; --accent2:#2853c2; --accentBg:#e9effc; --accentLine:#c3d2f2;
  --high:#146b33; --highBg:#e3f4e8; --highLine:#a3d8b3;
  --med:#8a5700; --medBg:#fff2d1; --medLine:#f0cf80;
  --low:#a44300; --lowBg:#ffe6d2; --lowLine:#f5b98a;
  --alert:#b3141c; --alertBg:#fde6e7; --alertLine:#f0a6aa;
  --co:#d6186a;
  font-size:15px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
.banner{background:#18223a;color:#fff;font-size:13px;text-align:center;padding:3px 8px;letter-spacing:.03em}
.top{display:flex;align-items:center;gap:16px;padding:0 16px;height:58px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;color:var(--accent);white-space:nowrap}
.cats{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.cat{border:1px solid transparent;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink2);white-space:nowrap}
.cat:hover{background:#eef2f8}
.cat.on{background:var(--accentBg);color:var(--accent);border-color:var(--accentLine)}
.top-r{display:flex;gap:10px;align-items:center}
.search{width:190px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#f7f9fc}
.rolesel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rolesel select{padding:8px 10px;border:1px solid var(--accentLine);border-radius:9px;background:#fff;font-weight:600;color:var(--ink);font-size:14px;cursor:pointer;max-width:290px}
.shell{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:10px 4px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2)}
.rail button:hover{background:#eef2f8}
.rail button.on{background:var(--accentBg);color:var(--accent)}
.rail svg{width:26px;height:26px}
.rail .rl{font-size:13px;color:var(--muted);text-align:center;margin-top:auto;padding:4px}
.main{min-height:0;min-width:0;overflow:hidden;position:relative}
.foot{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding:4px 16px;border-top:1px solid var(--line);background:var(--surface)}
.page{height:100%;overflow:auto;padding:18px 24px 28px}
.page-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.syn{font-size:13px;font-weight:600;color:var(--muted);border:1px dashed var(--line);padding:1px 7px;border-radius:6px;background:#fafbfd}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{background:#f1f4fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#15306f}
.btn.danger{color:var(--alert);border-color:var(--alertLine)}
.btn.good{background:var(--high);border-color:var(--high);color:#fff}
.btn.sm{padding:4px 10px;min-height:32px;font-size:14px}
.btn.dis{opacity:.42;cursor:not-allowed}
.btn.dis:hover{background:inherit}
.btn.primary.dis:hover{background:var(--accent)}
.linkb{border:0;background:none;color:var(--accent2);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:34px;height:32px;cursor:pointer;font-size:15px;padding:0 6px}
.icon-btn:hover{background:#f1f4fa}
.icon-btn.on{background:var(--accentBg);border-color:var(--accentLine)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap;background:#fff;line-height:1.35}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.96);text-decoration:underline}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.t-High{color:var(--high);background:var(--highBg);border-color:var(--highLine)}
.t-Medium{color:var(--med);background:var(--medBg);border-color:var(--medLine)}
.t-Low{color:var(--low);background:var(--lowBg);border-color:var(--lowLine)}
.t-Alert{color:var(--alert);background:var(--alertBg);border-color:var(--alertLine)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef1f6;color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.blue{background:var(--accentBg);color:var(--accent);border-color:var(--accentLine)}
.tag.green{background:var(--highBg);color:var(--high);border-color:var(--highLine)}
.tag.amber{background:var(--medBg);color:var(--med);border-color:var(--medLine)}
.tag.red{background:var(--alertBg);color:var(--alert);border-color:var(--alertLine)}
.tier{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;border:1px solid;white-space:nowrap}
.tier-Deterministic{color:#34405a;background:#eef1f6;border-color:#cfd6e2}
.tier-Governed{color:#1c3d8c;background:#e9effc;border-color:#c3d2f2}
.tier-Interpretive{color:#5b2a91;background:#f2eafb;border-color:#d7c3f0}
.tier-Reference{color:#0d5e63;background:#e2f4f4;border-color:#a8dadc}
/* cards, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile .n{font-size:30px;font-weight:700;line-height:1.15}
.tile .l{color:var(--muted);font-size:14px}
.tile.risk .n{color:var(--alert)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{width:100%;border-collapse:collapse;background:var(--surface)}
.grid th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 12px;background:#f6f8fb;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
.grid td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid tr.click{cursor:pointer}
.grid tr.click:hover td{background:#f4f7ff}
.grid tr.hot td{background:#f7f9ff}
.grid td.num{font-variant-numeric:tabular-nums}
.sla-risk{color:var(--alert);font-weight:700}
.dig{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:600}
.dig .bar{width:90px;height:8px;border-radius:4px;background:#e4e9f3;overflow:hidden;position:relative}
.dig .bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--accent2);border-radius:4px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,83,194,.35)}100%{box-shadow:0 0 0 10px rgba(40,83,194,0)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);padding:24px}
.empty .big{font-size:20px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.empty-box{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#fafbfd}
/* case */
.case{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0}
.case-h{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.case-h .ttl{font-size:19px;font-weight:700}
.case-h .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.rerun{display:flex;align-items:center;gap:12px;padding:9px 20px;background:#fff7e0;border-bottom:1px solid var(--medLine);font-weight:600;color:#5c3b00;flex-wrap:wrap}
.rerun.done{background:var(--highBg);color:var(--high);border-color:var(--highLine)}
.rerun.run{background:var(--accentBg);color:var(--accent);border-color:var(--accentLine)}
.agent-steps{display:flex;gap:6px;align-items:center}
.agent-steps .as{padding:3px 10px;border-radius:999px;border:1px solid var(--accentLine);background:#fff;font-size:13px}
.agent-steps .as.on{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.agent-steps .as.ok{background:var(--highBg);color:var(--high);border-color:var(--highLine)}
.case-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);min-height:0}
.docside{display:grid;grid-template-rows:auto minmax(0,1fr);border-right:1px solid var(--line);min-height:0;background:#e9ecf2}
.doctabs{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.doctab{border:1px solid var(--line);background:#fff;padding:5px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.doctab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:14px;color:var(--ink2)}
.docpane{overflow:auto;min-height:0;padding:18px}
.docinner{position:relative}
.paper{background:#fffef8;border:1px solid #d3cfbf;border-radius:4px;padding:20px 22px 26px;box-shadow:0 1px 3px rgba(0,0,0,.06);color:#1f1f1f;font-family:Arial,"Segoe UI",sans-serif;animation:fadein .25s ease}
.ph{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:12px;font-size:15px}
.ph span{font-size:13px;color:#555}
.secth{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:#ecebe4;padding:4px 8px;margin:14px 0 6px;border-left:3px solid #555}
.ff{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px;border-bottom:1px solid #d9d6ca;padding:5px 2px;align-items:baseline}
.ff .fl{font-size:13px;color:#555;text-transform:uppercase;letter-spacing:.03em}
.fv{font-family:Consolas,"Courier New",monospace;font-size:15px;color:#0d2a6b;display:inline-block;padding:0 2px}
.fv.blank{color:#999}
.ftab{width:100%;border-collapse:collapse;font-size:14px}
.ftab th{background:#ecebe4;text-align:left;padding:5px 8px;border:1px solid #bcb8a8;font-size:13px;text-transform:uppercase}
.ftab td{padding:6px 8px;border:1px solid #bcb8a8}
.ftab td .fv{font-size:15px}
.moq-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid #bcb8a8;padding:10px 10px;margin-top:12px;background:#fffdf3}
.moq-row .fl{font-size:13px;color:#555;text-transform:uppercase;font-weight:700}
.cbx{display:inline-flex;align-items:center;gap:5px;font-size:15px;padding:2px 3px}
.cbx .box{width:18px;height:18px;border:1.5px solid #333;display:inline-grid;place-items:center;background:#fff}
.cbx .box svg{width:16px;height:16px}
.hand{font-family:"Segoe Script","Bradley Hand","Lucida Handwriting","Comic Sans MS",cursive;font-size:34px;color:#1b3a8a;display:inline-block;transform:rotate(-7deg);position:relative;line-height:1;padding:0 10px 6px 6px}
.hand svg{position:absolute;left:-2px;bottom:-2px;width:46px;height:12px}
.hand-note{font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-size:14px;color:#1b3a8a}
.hl{position:absolute;border:3px solid var(--accent2);border-radius:6px;background:rgba(40,83,194,.07);transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease;pointer-events:none;z-index:2}
.hl.h2{border-color:#8a24c2;background:rgba(138,36,194,.08)}
.hl .hl-lab{position:absolute;top:-25px;left:-3px;background:var(--accent2);color:#fff;font-size:13px;font-weight:600;padding:1px 8px;border-radius:5px;white-space:nowrap;font-family:"Segoe UI",sans-serif}
.hl.h2 .hl-lab{background:#8a24c2;top:auto;bottom:-25px}
.label-art{max-width:520px;margin:0 auto;border:2px solid #333;border-radius:10px;padding:16px 18px;background:#fff}
.lab-top{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.lab-name{font-size:30px;font-weight:800;margin-top:6px;line-height:1.1}
.lab-name small{font-size:17px;font-weight:600}
.lab-str{font-size:24px;font-weight:800;color:#b3141c;margin:4px 0}
.lab-line{font-size:14px;margin:4px 0}
.rxbox{border:2px solid #333;padding:0 6px}
.srcnote{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff;border:1px dashed var(--line);font-size:14px;color:var(--ink2)}
.attrside{overflow:auto;min-height:0;padding:10px 16px 20px;background:var(--surface)}
.attr-top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:4px 0 6px;flex-wrap:wrap}
.grp h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;display:flex;justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:4px}
.arow{display:grid;grid-template-columns:minmax(120px,.9fr) minmax(0,1.3fr) auto auto;gap:8px;align-items:center;padding:5px 8px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.arow:hover{background:#f4f7ff}
.arow.sel{border-color:var(--accent2);background:var(--accentBg)}
.an{color:var(--ink2);font-size:14px}
.av{font-weight:600;min-width:0;overflow-wrap:anywhere}
.av .was{color:var(--muted);font-weight:500}
.aacts{display:flex;gap:4px;align-items:center}
.fb-ok{font-size:13px;color:var(--high);font-weight:600}
.ev{grid-column:1/-1;font-size:13px;color:var(--ink2);padding:2px 2px 2px 2px}
.editbox{grid-column:1/-1;background:#fff;border:1px solid var(--accentLine);border-radius:10px;padding:12px;margin:4px 0;display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;cursor:default}
.editbox label{font-size:14px;color:var(--ink2)}
.editbox input,.editbox select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.suggest{border:1px solid #d7c3f0;background:#f7f1fe;border-radius:12px;padding:12px 14px;margin:6px 0 8px;animation:fadein .3s ease}
.suggest .h{font-weight:700;color:#5b2a91;margin-bottom:4px}
.bottombar{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:10px 20px;background:var(--surface);border-top:1px solid var(--line)}
/* popover, overlays */
.scrim{position:fixed;inset:0;background:rgba(15,26,46,.28);z-index:40}
.pop{position:fixed;z-index:50;width:470px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(15,26,46,.22);padding:14px 16px;animation:fadein .18s ease}
.pop-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:#eef1f6}
.tsrow{display:grid;grid-template-columns:78px 1fr 42px;gap:4px 10px;align-items:center;margin-top:8px}
.tsrow .st{font-weight:700;font-size:14px}
.tsbar{height:12px;border-radius:6px;background:#edf0f5;overflow:hidden}
.tsbar i{display:block;height:100%;border-radius:6px}
.tsrow .sc{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:14px}
.tsrow .why{grid-column:2/4;font-size:13px;color:var(--ink2);margin-top:-2px}
.tsrow.low .st,.tsrow.low .why{color:var(--alert)}
.callbox{margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--medBg);border:1px solid var(--medLine);color:#5c3b00;font-weight:600;font-size:14px}
.callbox.ok{background:var(--highBg);border-color:var(--highLine);color:var(--high)}
.popfoot{margin-top:10px;font-size:13px;color:var(--muted);border-top:1px solid var(--line2);padding-top:8px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:92vw;background:#fff;z-index:45;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(15,26,46,.15);padding:18px 20px;overflow:auto;animation:fadein .2s ease}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;width:560px;max-width:94vw;background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(15,26,46,.25);padding:18px 20px}
.toasts{position:fixed;right:18px;bottom:42px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:#13213d;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.25);font-weight:600;max-width:520px;animation:fadein .2s ease}
.toast.ok::before{content:"✓ ";color:#7fe0a0}
.director{position:fixed;right:16px;top:96px;width:350px;max-height:calc(100vh - 140px);overflow:auto;background:#fff;border:2px solid var(--co);border-radius:12px;box-shadow:0 14px 36px rgba(15,26,46,.22);padding:12px 14px;z-index:60}
.director h3{display:flex;justify-content:space-between;align-items:center;color:var(--co)}
.director .dg{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;letter-spacing:.05em}
.director .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.director .btn{min-height:36px;font-size:14px;padding:5px 8px;white-space:normal;text-align:center}
.co{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--co);color:#fff;font-weight:800;font-size:15px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--co);margin:0 8px;flex:none;vertical-align:middle}
/* tower */
.tw{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tw-h{display:flex;align-items:center;gap:4px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:#eef2f8}
.tab.on{background:var(--accentBg);color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--alert);color:#fff;font-size:13px;font-weight:700;padding:0 6px}
.badge.zero{background:#cfd6e2;color:var(--ink2)}
.tw-role{margin-left:auto;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.tw-b{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:0}
.tw-b.notrace{grid-template-columns:250px minmax(0,1fr)}
.catcol,.flowcol,.trcol{overflow:auto;min-height:0}
.catcol{border-right:1px solid var(--line);background:var(--surface);padding:12px}
.flowcol{padding:14px 16px 40px}
.trcol{border-left:1px solid var(--line);background:#f6f7fa;padding:12px;display:flex;flex-direction:column}
.cg{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;margin:10px 0 4px}
.cr{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:6px 8px;cursor:pointer}
.cr:hover{background:#f1f4fa}
.cr.on{background:var(--accentBg);border-color:var(--accentLine)}
.cr .l1{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:14px}

function hit(t, k) {
  if (k instanceof RegExp) return k.test(t);
  if (k.length <= 3) return new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(t);
  return t.includes(k);
}
function matchScenario(text) {
  const t = text.toLowerCase();
  if (SC.S9.kw.some(k => hit(t, k))) return SC.S9;
  let best = null, bs = 0;
  for (const id of MATCH_ORDER) { const s = SC[id].kw.filter(k => hit(t, k)).length; if (s > bs) { bs = s; best = SC[id]; } }

    if (S.caseTab !== 'attrs') { S.caseTab = 'attrs'; return render(); }

    if (!cs.edit.reason) { cs.edit = { value: '1', reason: 'Write-in overrides checkbox', comment: 'Supplier wrote 1 by hand; checkbox shows 16' }; return render(); }
    return saveEdit();
  }

    if (d.sid !== 'S1') return proposeRule();
    if (!d.cpId && S.tower.tab !== 'rules') { S.tower.tab = 'rules'; return render(); }
    if (d.phase === 'interpreted' && !d.confirmed) { S.role = 'maker'; return confirmInterp(); }
    if (!d.checksDone) return;
    if (!d.sbRun.golden) { d.sbMode = 'golden'; return runSandbox(); }
    if (!d.sbRun.replay) { d.sbMode = 'replay'; return runSandbox(); }
    if (!d.cpId) { S.role = 'maker'; return openProposal(); }
    const p = findProp(d.cpId);

    if (S.scriptedReview && !p.scripted) return scriptedComment(p);

    if (!allApproved(p)) { if (S.role !== 'checker') { S.role = 'checker'; toast(`Role: ${PEOPLE.checker} (Business SME approver)`); return render(); } return approveProp(p); }
    if (!S.modal) return askMerge(p);
    return doMerge(findProp(S.modal.id));
  }
  if (cs.moqVersion !== S.reg.MOQ.live && !cs.approved) {
    if (S.screen !== 'case') { S.role = 'pm'; S.screen = 'case'; S.caseTab = 'attrs'; S.popover = null; return render(); }
    return rerunCase();
  }
  if (S.screen === 'case' && !S.script.sawTrust2) { S.script.sawTrust2 = true; S.caseTab = 'attrs'; selectAttr('moq'); openTrust('moq'); return; }
  if (!cs.approved) { S.popover = null; S.role = 'pm'; S.screen = 'case'; return approveCase(); }
  if (S.screen !== 'ops') { S.popover = null; S.role = 'ops'; S.screen = 'ops'; return render(); }
  toast('End of the scripted path · press D for the director panel');
}

function positionPopover() {

const ACTOR_IC = { agent: ['A', 'Agent'], rule: ['R', 'Rule'], model: ['✦', 'Model (LLM)'], human: ['H', 'Human'], system: ['S', 'System'] };
function auditMatch(e) {
  const F = S.auditF;
  if (F.type && e.type !== F.type) return false;
  if (F.actor && e.actor.kind !== F.actor) return false;
  if (F.special === 'llm' && e.type !== 'llm') return false;
  if (F.special === 'fail' && !['failure', 'retry'].includes(e.type)) return false;
  if (F.special === 'human' && e.actor.kind !== 'human') return false;
  if (F.field && ![].concat(e.field || []).includes(F.field)) return false;
  return true;
}
function vAudit(caseId) {

  const llm = list.filter(e => e.type === 'llm').length;
  const hits = list.reduce((t, e) => t + (e.detail.cacheHits || 0) + (/^hit/.test(e.detail.cache || '') ? 1 : 0), 0);
  const filtering = F.type || F.actor || F.special || F.field;
  const shown = list.filter(e => (filtering || !e.parent || S.auditOpen[e.parent]) && auditMatch(e)).slice().reverse();
  const types = AUDIT_TYPES.filter(t => list.some(e => e.type === t));
  const chip = (key, v, label) => `<button class="chip q ${F[key] === v ? 'on' : ''}" data-a="afilter" data-k="${key}" data-v="${v}">${label}</button>`;
  const row = e => {
    const open = S.auditOpen[e.id], [ic, al] = ACTOR_IC[e.actor.kind];
    const det = Object.entries(e.detail).filter(([k]) => k !== 'evidenceRef').map(([k, v]) => `<span class="k">${k}</span><span>${esc(v)}</span>`).join('');

      <button class="aev-h" data-a="aopen" data-v="${e.id}">

        <span class="asum"><b>${esc(e.actor.name)}</b> · ${esc(e.summary)}</span><span class="muted small">${open ? '▾' : '▸'}</span></button>
      ${open ? `<div class="adet"><div class="kv2">${det}<span class="k">event</span><span>${e.id}</span><span class="k">hash</span><span><code>${e.hash}</code> ← prev <code>${e.prevHash}</code></span>

        ${e.children ? `<div class="small muted" style="margin-top:4px">${e.children.length} per-field events below (collapse to hide)</div>` : ''}</div>` : ''}
    </div>`;
  };
  return `<div class="audit never-llm">
    <div class="ahead"><span><b>${list.length} events</b> · ${fails} failure${fails === 1 ? '' : 's'}${recovered ? ' (recovered)' : caseId === 'CASE-0098' ? ' · dead-letter' : ''} · ${llm} LLM calls · ${hits} cache hits · <span class="${ok ? 'okc' : 'badc'}">${ok ? 'Chain verified ✓' : 'Chain broken ✗'}</span></span>

  cmpa(t) { const sel = S.tower.vsel && S.vhist[S.tower.vsel] ? S.tower.vsel : 'MOQ'; const v = S.vhist[sel].map(x => x.ver); S.cmp = Object.assign({ rule: sel, a: v[Math.max(0, v.length - 2)], b: v[v.length - 1] }, S.cmp && S.cmp.rule === sel ? S.cmp : {}, { a: t.value }); render(); },
  cmpb(t) { const sel = S.tower.vsel && S.vhist[S.tower.vsel] ? S.tower.vsel : 'MOQ'; const v = S.vhist[sel].map(x => x.ver); S.cmp = Object.assign({ rule: sel, a: v[Math.max(0, v.length - 2)], b: v[v.length - 1] }, S.cmp && S.cmp.rule === sel ? S.cmp : {}, { b: t.value }); render(); },
  mapcat(t) { S.map.cat = t.value; S.map.sel = null; S.map.tx = 0; S.map.ty = 0; render(); },
  gapsonly(t) { S.map.gapsOnly = t.checked; if (t.checked) GROUPS.forEach(g => { S.map.open[g.g] = true; }); S.map.k = 0.85; S.map.tx = 0; S.map.ty = 0; render(); },
  mshadow(t) { const p = S.modal && findProp(S.modal.id); if (p) p.shadow = t.checked; }
});

/* map drag-to-pan */
let mapDrag = null, mapMoved = false;
function bindMap() {
  const svg = document.getElementById('mapsvg');
  if (!svg) return;
  svg.addEventListener('pointerdown', e => { mapDrag = { x: e.clientX, y: e.clientY, tx: S.map.tx, ty: S.map.ty }; mapMoved = false; });
  svg.addEventListener('pointermove', e => {
    if (!mapDrag) return;
    const dx = e.clientX - mapDrag.x, dy = e.clientY - mapDrag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) mapMoved = true;
    if (!mapMoved) return;
    S.map.tx = mapDrag.tx + dx; S.map.ty = mapDrag.ty + dy;
    const g = document.getElementById('mapg'); if (g) g.setAttribute('transform', `translate(${S.map.tx},${S.map.ty}) scale(${S.map.k})`);
  });
  const end = () => { mapDrag = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointerleave', end);
}
document.addEventListener('click', e => { if (mapMoved && e.target.closest && e.target.closest('#mapsvg')) { e.stopPropagation(); mapMoved = false; } }, true);

render();
</script>
